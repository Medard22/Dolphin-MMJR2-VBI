name: TCL TV armeabi-v7a APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tcl-tv-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "30.0.15729638"
  CMAKE_VERSION: "3.31.6"
  ANDROID_COMPILE_SDK: "37"

jobs:
  build-apk:
    name: Build debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake, and platform packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Raise Gradle heap for native compile
        run: |
          sed -i 's/-Xmx2048m/-Xmx6g/' Source/Android/gradle.properties

      - name: Make Gradle wrapper executable
        run: chmod +x Source/Android/gradlew

      - name: Assemble debug APK
        working-directory: Source/Android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK
        working-directory: Source/Android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect armeabi-v7a APKs
        run: |
          mkdir -p artifacts
          find Source/Android/app/build/outputs/apk -type f -name "*.apk" -print
          find Source/Android/app/build/outputs/apk -type f -name "*.apk" -exec cp -v {} artifacts/ \;
          ls -lh artifacts

      - name: Upload armeabi-v7a APKs
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-tcl-tv-armeabi-v7a
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
